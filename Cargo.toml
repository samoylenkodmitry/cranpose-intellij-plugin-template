[workspace]
members = ["ui", "host", "xtask", "sdk/host", "sdk/jvm-bridge", "sdk/tools", "sdk/ux", "sdk/ui", "sdk/watch", "sdk/process", "sdk/cache", "sdk/authoring", "sdk/authoring-ui"]
resolver = "3"

[workspace.package]
version = "0.8.1"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
