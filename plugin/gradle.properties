pluginVersion = 0.1.0
pluginSinceBuild = 261

# The IDE the plugin compiles against and `runIde` starts. Point
# `platformLocalPath` at an installed JetBrains IDE (IntelliJ IDEA, RustRover,
# Android Studio, ...) to skip the download.
platformVersion = 2026.1
# platformLocalPath = /Applications/IntelliJ IDEA.app
# A project `runIde` opens on start.
# runIdeProject = /path/to/project

# The JDK the plugin compiles with: 2026.1 platforms run on Java 21, later
# ones on Java 25, and both load Java 21 classes.
jvmToolchain = 21

# Where `cargo build` puts the UI binary it bundles: the workspace's own
# target directory, shared with `cargo build` and `cargo run`.
cranposeCargoTargetDir = ../target
# A directory of prebuilt UI binaries, one `<os>-<arch>/` folder each (as CI
# produces them), bundled instead of building for this machine only.
# cranposeNativeDir = /path/to/native

kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true
