[package]
name = "cranpose-plugin-ui"
description = "Shared Cranpose UI controls and task output for native IntelliJ plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cranpose = { version = "0.9.32", features = ["embed"] }
cranpose-core = { version = "0.9.32" }
cranpose-plugin-ux = { path = "../ux" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
