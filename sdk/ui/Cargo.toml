[package]
name = "cranpose-plugin-ui"
description = "Shared Cranpose UI controls and task output for native IntelliJ plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cranpose = { version = "0.1.175", git = "https://github.com/samoylenkodmitry/Cranpose", rev = "a49e7a781bfbab626f4ea3f6aadbdc2c1eb3e06b", features = ["embed"] }
cranpose-core = { version = "0.1.175", git = "https://github.com/samoylenkodmitry/Cranpose", rev = "a49e7a781bfbab626f4ea3f6aadbdc2c1eb3e06b" }
cranpose-plugin-ux = { path = "../ux" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
