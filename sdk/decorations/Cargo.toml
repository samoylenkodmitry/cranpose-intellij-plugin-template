[package]
name = "cranpose-plugin-decorations"
description = "Event-driven GPU rendering for Cranpose editor decorations"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
anyhow = "1"
cranpose-plugin-gpu = { path = "../gpu" }
cranpose-plugin-authoring-ui = { path = "../authoring-ui" }
cranpose = { version = "0.1.176", git = "https://github.com/samoylenkodmitry/Cranpose", rev = "283736c61e85486214ba0ef8b9ac813000b5055d", features = ["renderer-wgpu"] }
cranpose-core = { version = "0.1.176", git = "https://github.com/samoylenkodmitry/Cranpose", rev = "283736c61e85486214ba0ef8b9ac813000b5055d" }
cranpose-app-shell = { version = "0.1.176", git = "https://github.com/samoylenkodmitry/Cranpose", rev = "283736c61e85486214ba0ef8b9ac813000b5055d" }
cranpose-render-wgpu = { version = "0.1.176", git = "https://github.com/samoylenkodmitry/Cranpose", rev = "283736c61e85486214ba0ef8b9ac813000b5055d" }
