[package]
name = "cranpose-plugin-authoring"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust source ranges and live literal contracts for Cranpose development tools"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
sha2 = "0.10"
rand = "0.9"

[lints]
workspace = true
