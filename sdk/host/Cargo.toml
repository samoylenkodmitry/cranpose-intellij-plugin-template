[package]
name = "cranpose-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust implementation of Cranpose IntelliJ platform integration"
[features]
ide-tests = []
host-library = []
[lib]
crate-type = ["rlib"]
[dependencies]
cranpose-plugin-process = { path = "../process" }
jni = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.9"
regex = "1"

[dev-dependencies]
tempfile = "3"
ctrlc = { version = "3", features = ["termination"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
unwrap_used = "deny"
