[package]
name = "cranpose-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust implementation of Cranpose IntelliJ platform integration"
[features]
ide-tests = []
host-library = []
[lib]
crate-type = ["rlib"]
[dependencies]
cranpose-plugin-authoring = { path = "../authoring" }
cranpose-plugin-process = { path = "../process" }
jni = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.10"
regex = "1"
tempfile = "3"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
ctrlc = { version = "3", features = ["termination"] }
toml_edit = "0.22"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
unwrap_used = "deny"
