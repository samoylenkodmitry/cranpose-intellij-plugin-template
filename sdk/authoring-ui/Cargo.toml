[package]
name = "cranpose-plugin-authoring-ui"
description = "Native Cranpose editor controls and decorations for IntelliJ plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
cranpose-plugin-authoring = { path = "../authoring" }
cranpose-animation = { version = "0.13.0" }
cranpose-plugin-ux = { path = "../ux" }
cranpose = { version = "0.13.0", features = ["embed"] }
cranpose-core = { version = "0.13.0" }
cranpose-ui-graphics = { version = "0.13.0" }
serde_json = "1"
[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
[lints]
workspace = true
