[package]
name = "cranpose-intellij-ui"
description = "The tool window UI: runs inside the IDE, or on its own as a desktop window."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "cranpose-intellij-ui"
path = "src/main.rs"

[features]
default = ["desktop"]
# Opens an ordinary desktop window when the binary is started without an IDE,
# for iterating on the UI with `cargo run`. The plugin bundles a build without
# it, which carries no windowing code at all.
desktop = ["cranpose/desktop"]

[dependencies]
cranpose-plugin-authoring-ui = { path = "../sdk/authoring-ui" }
cranpose-plugin-ux = { path = "../sdk/ux" }
cranpose = { version = "0.1.169", git = "https://github.com/samoylenkodmitry/Cranpose", rev = "0ccc2a2bc4f9ad9002dcdb80ff2e75aa707494bb", features = ["embed"] }
cranpose-animation = { version = "0.1.169", git = "https://github.com/samoylenkodmitry/Cranpose", rev = "0ccc2a2bc4f9ad9002dcdb80ff2e75aa707494bb" }
cranpose-core = { version = "0.1.169", git = "https://github.com/samoylenkodmitry/Cranpose", rev = "0ccc2a2bc4f9ad9002dcdb80ff2e75aa707494bb" }
cranpose-ui-graphics = { version = "0.1.169", git = "https://github.com/samoylenkodmitry/Cranpose", rev = "0ccc2a2bc4f9ad9002dcdb80ff2e75aa707494bb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[dev-dependencies]
# Validates the WGSL shaders in unit tests; the same naga wgpu compiles them with.
naga = { version = "30", features = ["wgsl-in"] }
