name: GPU presentation probes
on:
  pull_request:
    paths: ["sdk/tools/probes/**", ".github/workflows/gpu-presentation.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpu-presentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Configure Microsoft C++ compiler
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          & "$installation/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('Path', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'WindowsSdkDir', 'WindowsSDKVersion')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
      - run: python sdk/tools/probes/fetch_runtime.py --output target/probe-runtime
      - run: python sdk/tools/probes/native_layer.py --java-home "$env:CRANPOSE_PROBE_JAVA_HOME" --output target/gpu-probe/windows
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gpu-presentation-windows
          path: target/gpu-probe
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxfixes-dev libxrender-dev libegl1-mesa-dev libgles2-mesa-dev libwayland-dev xvfb picom
      - run: python sdk/tools/probes/fetch_runtime.py --output target/probe-runtime
      - run: bash sdk/tools/probes/linux_session.sh target/gpu-probe/linux "$CRANPOSE_PROBE_JAVA_HOME"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gpu-presentation-linux
          path: target/gpu-probe
