name: Cranpose main
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Compatibility with Cranpose main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p cranpose-template-tools -- use-framework-main
      - run: cargo test --locked --no-default-features --workspace
      - run: cargo run --locked -p cranpose-template-tools -- fetch-ide
      - run: cargo run --locked -p cranpose-template-tools -- ide-test --ide "$CRANPOSE_TEST_IDE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: framework-compatibility-evidence
          path: |
            target/ide-tests/**/evidence
            target/ide-tests/**/console.log
          if-no-files-found: ignore
