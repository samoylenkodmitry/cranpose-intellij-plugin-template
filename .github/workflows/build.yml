name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lifecycle:
    name: Process lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p cranpose-plugin-cache
      - run: cargo test --locked -p cranpose-plugin-authoring
      - run: cargo test --locked -p cranpose-plugin-host starter::tests
      - run: cargo test --locked -p cranpose-plugin-host model::tests
      - run: cargo test --locked -p cranpose-plugin-process -p cranpose-plugin-host --test lifecycle --test session_lifecycle --test stream
  native:
    name: Rust host and Cranpose UI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, exe: cranpose-intellij-ui, lib: libcranpose_ide_host.dylib }
          - { platform: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, exe: cranpose-intellij-ui, lib: libcranpose_ide_host.dylib }
          - { platform: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: cranpose-intellij-ui, lib: libcranpose_ide_host.so }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: cranpose-intellij-ui, lib: libcranpose_ide_host.so }
          - { platform: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, exe: cranpose-intellij-ui.exe, lib: cranpose_ide_host.dll }
          - { platform: windows-aarch64, os: windows-latest, target: aarch64-pc-windows-msvc, exe: cranpose-intellij-ui.exe, lib: cranpose_ide_host.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --no-default-features -p cranpose-intellij-ui -p cranpose-template-host --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.exe }}
            target/${{ matrix.target }}/release/${{ matrix.lib }}
          if-no-files-found: error
  test:
    name: Rust and native IDE integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --no-default-features --workspace --all-targets --features cranpose-template-host/ide-tests -- -D warnings
      - run: cargo test --locked --no-default-features --workspace
      - run: cargo run --locked -p cranpose-template-tools -- release audit-source
      - run: cargo run --locked -p cranpose-template-tools -- fetch-ide
      - run: cargo run --locked -p cranpose-template-tools -- ide-test --ide "$CRANPOSE_TEST_IDE"
      - run: cargo build --locked --no-default-features -p cranpose-intellij-ui
      - run: cargo run --locked -p cranpose-template-tools -- authoring-smoke --binary target/debug/cranpose-intellij-ui --log authoring.log --report authoring.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ide-test-evidence
          path: |
            target/ide-tests/**/evidence
            target/ide-tests/**/console.log
            target/ide-tests/**/log
            authoring.log
            authoring.json
            authoring-controls-*.png
            lightning-*.png
          if-no-files-found: ignore
  plugin:
    name: Verified plugin (all platforms)
    needs: [native, test, lifecycle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native
      - run: cargo run --locked -p cranpose-template-tools -- package --native-dir native --output "${{ runner.temp }}/cranpose-package"
      - run: cargo run --locked -p cranpose-template-tools -- release check-zip "${{ runner.temp }}/cranpose-package"/cranpose-template-*.zip
      - run: cargo run --locked -p cranpose-template-tools -- fetch-ide
      - run: cargo run --locked -p cranpose-template-tools -- release verify "${{ runner.temp }}/cranpose-package"/cranpose-template-*.zip --ide "$CRANPOSE_TEST_IDE"
      - run: cargo run --locked -p cranpose-template-tools -- fetch-ide --product RustRover --version 2026.2.3
      - run: cargo run --locked -p cranpose-template-tools -- release verify "${{ runner.temp }}/cranpose-package"/cranpose-template-*.zip --ide "$CRANPOSE_TEST_IDE"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: ${{ runner.temp }}/cranpose-package/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification
          path: target/verification
          if-no-files-found: ignore
